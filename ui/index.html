<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste WiFi Portátil</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="widget-container">
        <!-- Header -->
        <div class="header">
            <div class="title">
                <i class="fa-solid fa-wifi" style="color: var(--accent); margin-right: 5px; filter: drop-shadow(0 0 5px var(--accent));"></i> SpeedTest
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="window.api.quitApp()" title="Sair"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

        <!-- Dashboard -->
        <div class="system-dashboard">
            <div class="dash-main" style="justify-content: center; text-align: center; margin-bottom: 10px;">
                <div class="dash-time" id="statusText" style="font-size: 20px;">Pronto para iniciar</div>
                <div class="dash-weather" id="serverInfo" style="margin-top: 10px; justify-content: center; background: transparent; border: none; box-shadow: none;"></div>
            </div>
            
            <div class="dash-metrics" style="flex-direction: column;">
                <div class="metric-chip" style="padding: 15px; justify-content: space-between; padding-left: 20px; padding-right: 20px;">
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <i class="fa-solid fa-stopwatch" style="font-size: 16px;"></i> 
                        <span style="font-size: 13px; color: var(--text-dim);">PING</span>
                    </div>
                    <span class="value" id="pingValue" style="font-size: 20px; font-weight: 800; color: var(--text-primary);">-- <small style="font-size: 11px; color: var(--text-dim); font-weight: 500;">ms</small></span>
                </div>

                <div class="metric-chip" style="padding: 15px; justify-content: space-between; padding-left: 20px; padding-right: 20px;">
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <i class="fa-solid fa-download" style="font-size: 16px;"></i> 
                        <span style="font-size: 13px; color: var(--text-dim);">DOWNLOAD</span>
                    </div>
                    <span class="value" id="downloadValue" style="font-size: 20px; font-weight: 800; color: var(--success);">-- <small style="font-size: 11px; color: var(--text-dim); font-weight: 500;">Mbps</small></span>
                </div>

                <div class="metric-chip" style="padding: 15px; justify-content: space-between; padding-left: 20px; padding-right: 20px;">
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <i class="fa-solid fa-upload" style="font-size: 16px;"></i> 
                        <span style="font-size: 13px; color: var(--text-dim);">UPLOAD</span>
                    </div>
                    <span class="value" id="uploadValue" style="font-size: 20px; font-weight: 800; color: var(--accent);">-- <small style="font-size: 11px; color: var(--text-dim); font-weight: 500;">Mbps</small></span>
                </div>
            </div>
        </div>

        <div style="padding: 20px; margin-top: auto;">
            <button id="startBtn" class="btn btn-primary" style="width: 100%; border-radius: 12px; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <i class="fa-solid fa-play"></i> INICIAR TESTE
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
